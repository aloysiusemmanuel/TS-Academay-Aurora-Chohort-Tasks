<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire frame with HTML</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">

            <div class="logo">
                <img src="" alt="">Logo
            </div>

            <div class="nav-link">
                <a href="#">About</a>
                <a href="#">Skills</a>
                <a href="#">Project</a>
                <a href="#">Contact</a>
            </div>
        </div>

        <!-- Hero Section -->

        <div class="hero-section">
            <div class="about-section">
                Section for About Page
            </div>

            <div class="img-rh-section">
                Right Hand Section for the Image
            </div>
        </div>

        <!-- Skills Section -->

        <div class="skill-section">
            <div class="skills">Skill 1</div>
            <div class="skills">Skill 2</div>
            <div class="skills">Skill 3</div>
            <div class="skills">Skill 4</div>
        </div>

        <!-- Project Section -->

        <div class="project-section">
            <div class="projects">Project 1</div>
            <div class="projects">Project 2</div>
            <div class="projects">Project 3</div>
            <div class="projects">Project 4</div>
        </div>

        <!-- Footer -->

        <div class="footer">

            <!-- contact form -->
             <div class="form">
                <form>
                    <div class="name-form">
                        <label for="name">Name</label>
                        <input type="text" placeholder="your name">
                    </div>
                    
                    <div class="email-form">
                        <label for="email">Email</label>
                        <input type="email" placeholder="your email">
                    </div>

                    <div class="textarea-form">
                        <label for="textarea">Message</label>
                        <textarea name="" id="" rows="5" cols="30" placeholder="Type Your Message"></textarea>
                    </div>

                    <div class="submit-btn">Submit</div>
                </form>
             </div>

             <!-- social networks -->
              <div class="social-network">
                <a href="http://#" target="_blank" rel="noopener noreferrer">facebook</a>
                <a href="http://#" target="_blank" rel="noopener noreferrer">X</a>
                <a href="http://#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="http://#" target="_blank" rel="noopener noreferrer">GitHub</a>
              </div>
        </div>
    </div>
    
</body>
</html>
